<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operation: White Shield | G-DECK</title>
  <link rel="stylesheet" href="css/terminal.css">
  <link rel="stylesheet" href="css/effects.css">
</head>
<body>
  <div id="crt-overlay"></div>
  <div id="attack-overlay"></div>

  <!-- HUD Overlay -->
  <div id="hud-overlay">
    <div id="hud-top">
      <span class="hud-item" style="color:rgba(0,204,255,0.8)">G-DECK v3.7</span>
      <span class="hud-item">BAT <span id="hud-bat-val">100</span>%</span>
      <span class="hud-item"><span id="hud-stl-bar">&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;</span> STL <span id="hud-stl-val">100</span>%</span>
      <span class="hud-item hud-good" id="hud-oracle">O.R.O.R.A: STANDBY</span>
    </div>
    <div id="hud-bottom">
      <span class="hud-item" id="hud-titan">TITAN: --</span>
      <span class="hud-item">TEMP <span id="hud-temp-val">42</span><span id="hud-temp-unit">&deg;C</span></span>
      <span class="hud-item">MISSION <span id="hud-mis-val">--/--</span></span>
    </div>
  </div>

  <!-- BGM Controls -->
  <div id="bgm-panel">
    <button id="bgm-toggle" title="BGM ON/OFF">&#9835;</button>
    <input type="range" id="bgm-volume" min="0" max="100" value="30" title="볼륨">
    <span id="bgm-vol-label">30%</span>
  </div>

  <div id="terminal">
    <div id="output"></div>
    <div id="input-line" class="hidden">
      <span id="prompt" class="user-input">$ </span>
      <input type="text" id="command-input" spellcheck="false" autocomplete="off" autocapitalize="off">
      <span id="cursor" class="cursor"></span>
    </div>
  </div>

  <!-- BGM Audio Element -->
  <audio id="bgm-audio" loop preload="auto">
    <source src="bgm/White Shield.mp3" type="audio/mpeg">
  </audio>

  <!-- Load order matters: data first, then engine, then bootstrap -->
  <script src="data/strings.js"></script>
  <script src="data/stages.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/hint-system.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/stage-manager.js"></script>
  <script src="js/bgm.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
